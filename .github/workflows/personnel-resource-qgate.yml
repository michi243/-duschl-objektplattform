name: Personnel Resource Quality Gate
on:
  pull_request:
    paths:
      - 'employee-time.js'
      - 'resource-personnel-link.js'
      - 'workforce-planning.js'
      - 'tests/**'
      - 'release.json'
      - 'index.html'
      - '.github/workflows/personnel-resource-qgate.yml'
  push:
    branches: [main]
    paths:
      - 'employee-time.js'
      - 'resource-personnel-link.js'
      - 'workforce-planning.js'
      - 'tests/**'
      - 'release.json'
      - 'index.html'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and scheduling checks
        run: |
          node --check employee-time.js
          node --check resource-personnel-link.js
          node --check workforce-planning.js
          node --test tests/workforce-planning.test.cjs tests/personnel-assignment-gate.test.cjs tests/resource-personnel-link.test.cjs
      - name: Central release and cache key
        run: |
          node - <<'NODE'
          const fs=require('fs'), assert=require('assert/strict');
          const index=fs.readFileSync('index.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('release.json','utf8'));
          assert.equal(manifest.version,'3.57.15');
          assert.match(index,/let APP_VERSION='3\.57\.15'/);
          assert.match(index,/employee-time\.js\?v=3\.57\.15/);
          assert.equal(manifest.channel,'development');
          NODE
